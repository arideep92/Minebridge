
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.minebridge'
version = '1.3.2'

repositories {
    mavenCentral()

    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.6-R0.1-SNAPSHOT'
    implementation('net.dv8tion:JDA:5.6.1') {
        // MineBridge does not use Discord voice/audio features.
        exclude group: 'club.minnced', module: 'opus-java'
        exclude group: 'com.google.crypto.tink', module: 'tink'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.spigotmc:spigot-api:1.20.6-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing'])
}

tasks.jar {
    archiveBaseName = 'MineBridge'
}

tasks.shadowJar {
    archiveClassifier = ''
    mergeServiceFiles()

    relocate 'net.dv8tion', 'com.minebridge.libs.jda'
    relocate 'com.fasterxml.jackson', 'com.minebridge.libs.jackson'
    relocate 'okhttp3', 'com.minebridge.libs.okhttp3'
    relocate 'okio', 'com.minebridge.libs.okio'
    relocate 'gnu.trove', 'com.minebridge.libs.trove'
    relocate 'org.apache.commons.collections4', 'com.minebridge.libs.commons.collections4'
    relocate 'com.neovisionaries', 'com.minebridge.libs.neovisionaries'
    relocate 'kotlin', 'com.minebridge.libs.kotlin'
    relocate 'org.jetbrains', 'com.minebridge.libs.jetbrains'
    relocate 'org.intellij', 'com.minebridge.libs.intellij'

    // Non-runtime build and Kotlin compiler metadata.
    exclude 'META-INF/maven/**'
    exclude 'META-INF/proguard/**'
    exclude '**/*.kotlin_metadata'
    exclude '**/*.kotlin_builtins'
    exclude '**/*.kotlin_module'

    // Verified-unused Trove4j primitive collections and wrappers (JDA 5.6.1 uses Int/Long/Object only).
    exclude 'gnu/trove/**/*Byte*'
    exclude 'gnu/trove/**/*Short*'
    exclude 'gnu/trove/**/*Char*'
    exclude 'gnu/trove/**/*Float*'
    exclude 'gnu/trove/**/*Double*'
    exclude 'gnu/trove/decorator/**'
    exclude 'gnu/trove/impl/unmodifiable/**'
    exclude 'gnu/trove/TCollections.class'
    exclude 'gnu/trove/TDecorators.class'

    finalizedBy tasks.register('copyChangelog', Copy) {
        from layout.projectDirectory.file('CHANGELOG.md')
        into layout.buildDirectory.dir('libs')
    }
}

tasks.test {
    useJUnitPlatform()
}

tasks.build {
    dependsOn tasks.shadowJar
}

def nvdApiKey = providers.environmentVariable('NVD_API_KEY').orNull
def dependencyCheckKevEnabledValue = providers.gradleProperty('dependencyCheckKevEnabled').orNull
if (dependencyCheckKevEnabledValue != null
        && !dependencyCheckKevEnabledValue.equalsIgnoreCase('true')
        && !dependencyCheckKevEnabledValue.equalsIgnoreCase('false')) {
    throw new GradleException('dependencyCheckKevEnabled must be true or false')
}
def dependencyCheckKevEnabled = dependencyCheckKevEnabledValue == null
        || dependencyCheckKevEnabledValue.equalsIgnoreCase('true')

dependencyCheck {
    scanConfigurations = ['runtimeClasspath']
    formats = ['HTML', 'JSON']
    failBuildOnCVSS = 7.0
    outputDirectory = layout.buildDirectory.dir('reports/dependency-check')
    nvd {
        if (nvdApiKey != null && !nvdApiKey.isBlank()) {
            apiKey = nvdApiKey
        }
    }
    analyzers {
        kev {
            enabled = dependencyCheckKevEnabled
        }
    }
}
