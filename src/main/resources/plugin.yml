name: MineBridge
version: 1.3.1
main: com.minebridge.MineBridgePlugin
api-version: '1.20'
description: Minecraft and Discord integration with chat and event announcements
author: Arix
softdepend: [LuckPerms, Vault, Essentials, Multiverse-Core, PlaceholderAPI]

commands:
  minebridge:
    description: Manage the MineBridge Discord integration
    usage: /minebridge <help|status|server|players|reload>
    aliases: [mb]

permissions:
  minebridge.admin:
    description: Allows management of MineBridge
    default: op
