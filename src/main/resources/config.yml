# ==============================================================================
# MineBridge — Main Configuration (v1.4.1)
# Documentation: https://github.com/aridrochatterjee/MineBridge
# ==============================================================================
# MineBridge connects Minecraft and Discord with three supported integration modes:
#   - BOT: Two-way chat relay & outbound embeds via Discord Bot gateway (Default).
#   - WEBHOOK: Outbound-only delivery via asynchronous Discord webhooks.
#   - HYBRID: Webhook outbound chat + Bot inbound chat and gateway listener.
# ==============================================================================

discord:
  # Integration mode: BOT, WEBHOOK, or HYBRID (case-insensitive, default: BOT).
  mode: BOT

  # Discord Bot Gateway Settings (Required for BOT and HYBRID modes):
  # You can also use environment variables: "${MINEBRIDGE_BOT_TOKEN}"
  bot-token: ""
  # 17-20 digit Snowflake ID of your primary Discord chat channel.
  channel-id: ""

  # Discord Webhook Settings (Required for WEBHOOK and HYBRID modes):
  webhook:
    # Full Discord Webhook URL obtained from Discord Channel Settings -> Integrations -> Webhooks.
    url: ""

# Feature toggles: Easily enable or disable major MineBridge systems.
features:
  # Enable bidirectional chat relay between Minecraft and Discord.
  chat-relay: true
  # Enable player join, leave, and first-join notifications.
  join-leave: true
  # Enable player death announcements to Discord.
  deaths: true
  # Enable advancement and challenge completion announcements to Discord.
  advancements: true
  # Enable /minebridge server in-game command.
  server-status: true
  # Enable /minebridge players in-game command.
  player-list: true

# Server metadata used across embed footers and templates via the {server} placeholder.
server:
  name: "Minecraft Server"

# Update Checker: Check for newer releases on Modrinth once during startup.
update-checker:
  enabled: true

# In-game update notifications for administrators
notifications:
  admin-update-notification: true
  admin-update-notification-on-join: true

# Startup console branding
startup:
  banner: true
